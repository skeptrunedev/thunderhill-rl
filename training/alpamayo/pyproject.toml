[project]
name = "thunderhill-alpamayo"
version = "0.1.0"
requires-python = "==3.12.*"
# Upstream ExpertModelRL is imported from pinned source trees, not its Cosmos
# distributed trainer. This environment intentionally contains no vLLM or SFT.
dependencies = [
  "torch==2.8.0",
  "torchvision==0.23.0",
  "transformers==4.57.1",
  "peft==0.17.1",
  "diffusers==0.37.1",
  "accelerate==1.11.0",
  "huggingface-hub==0.36.0",
  "hydra-core==1.3.2",
  "einops==0.8.1",
  "colorlog==6.10.1",
  "numpy==2.2.6",
  "scipy==1.16.3",
  "pillow==12.0.0",
  "safetensors==0.6.2",
  "wandb==0.23.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
